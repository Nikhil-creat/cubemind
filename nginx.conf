server{listen 80;root /usr/share/nginx/html;index index.html;gzip on;gzip_types text/css application/javascript application/json image/svg+xml;
location ~* \.(svg|webmanifest)$ {add_header Cache-Control "public, max-age=86400";}
location = /sw.js {add_header Cache-Control "no-cache";}
location / {add_header Cache-Control "no-cache";try_files $uri $uri/ /index.html;}}
